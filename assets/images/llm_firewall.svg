<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="60%" stop-color="#050814" />
      <stop offset="100%" stop-color="#020308" />
    </radialGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 210, 255, 0.15)" />
      <stop offset="50%" stop-color="rgba(189, 0, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(0, 210, 255, 0.15)" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.75)" />
      <stop offset="100%" stop-color="rgba(7, 12, 26, 0.85)" />
    </linearGradient>

    <linearGradient id="cyanGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>

    <linearGradient id="purpleGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="redAlertGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(239, 68, 68, 0.2)" />
      <stop offset="100%" stop-color="rgba(239, 68, 68, 0.05)" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Share+Tech+Mono&amp;family=Space+Grotesk:wght@400;600&amp;display=swap');
    
    text { font-family: 'Space Grotesk', system-ui, sans-serif; }
    .mono { font-family: 'Share Tech Mono', monospace; }
    .orbitron { font-family: 'Orbitron', sans-serif; }
    
    .grid-line { stroke: rgba(0, 210, 255, 0.04); stroke-width: 1; }
    .hud-border { stroke: rgba(0, 210, 255, 0.25); stroke-width: 1; }
    .hud-title { fill: #ffffff; font-weight: 700; letter-spacing: 1.5px; }
    .text-cyan { fill: #00d2ff; }
    .text-purple { fill: #c084fc; }
    .text-green { fill: #4ade80; }
    .text-red { fill: #f87171; }
    .text-muted { fill: #94a3b8; }
  </style>

  <!-- Canvas Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Cyber Grid Background Pattern -->
  <g>
    <!-- Horizontal Grid -->
    <line x1="0" y1="80" x2="1280" y2="80" class="grid-line" />
    <line x1="0" y1="160" x2="1280" y2="160" class="grid-line" />
    <line x1="0" y1="240" x2="1280" y2="240" class="grid-line" />
    <line x1="0" y1="320" x2="1280" y2="320" class="grid-line" />
    <line x1="0" y1="400" x2="1280" y2="400" class="grid-line" />
    <line x1="0" y1="480" x2="1280" y2="480" class="grid-line" />
    <line x1="0" y1="560" x2="1280" y2="560" class="grid-line" />
    <line x1="0" y1="640" x2="1280" y2="640" class="grid-line" />
    <!-- Vertical Grid -->
    <line x1="160" y1="0" x2="160" y2="720" class="grid-line" />
    <line x1="320" y1="0" x2="320" y2="720" class="grid-line" />
    <line x1="480" y1="0" x2="480" y2="720" class="grid-line" />
    <line x1="640" y1="0" x2="640" y2="720" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="720" class="grid-line" />
    <line x1="960" y1="0" x2="960" y2="720" class="grid-line" />
    <line x1="1120" y1="0" x2="1120" y2="720" class="grid-line" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="640" cy="360" r="320" fill="#00d2ff" opacity="0.03" filter="blur(60px)" />
  <circle cx="300" cy="450" r="220" fill="#a855f7" opacity="0.04" filter="blur(50px)" />
  <circle cx="980" cy="250" r="200" fill="#3b82f6" opacity="0.04" filter="blur(50px)" />

  <!-- ================= BROWSER APP WINDOW CONTAINER ================= -->
  <rect x="40" y="30" width="1200" height="660" rx="12" fill="rgba(8, 14, 28, 0.85)" stroke="rgba(0, 210, 255, 0.3)" stroke-width="1.5" />
  
  <!-- Window Header Bar -->
  <path d="M 40,42 C 40,35.3 45.3,30 52,30 L 1228,30 C 1234.7,30 1240,35.3 1240,42 L 1240,75 L 40,75 Z" fill="url(#headerGrad)" />
  <line x1="40" y1="75" x2="1240" y2="75" stroke="rgba(0, 210, 255, 0.2)" stroke-width="1" />

  <!-- Window Controls (Red, Yellow, Green dots) -->
  <circle cx="70" cy="52.5" r="6" fill="#ef4444" />
  <circle cx="90" cy="52.5" r="6" fill="#f59e0b" />
  <circle cx="110" cy="52.5" r="6" fill="#10b981" />

  <!-- App Title & Breadcrumb -->
  <text x="140" y="57" class="orbitron hud-title" font-size="14" fill="#ffffff">DUAL-LAYER AI FIREWALL <tspan fill="#00d2ff">// Threat Operations Center</tspan></text>
  
  <!-- System Status Badge -->
  <rect x="1050" y="42" width="160" height="24" rx="12" fill="rgba(34, 197, 94, 0.15)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1" />
  <circle cx="1066" cy="54" r="4" fill="#22c55e" filter="url(#glowCyan)" />
  <text x="1078" y="58" class="mono" font-size="11" fill="#4ade80" font-weight="bold">SYSTEM ACTIVE</text>

  <!-- ================= LEFT PANEL: METRICS & ENGINE STATUS ================= -->
  <rect x="65" y="95" width="310" height="570" rx="8" fill="url(#cardGrad)" stroke="rgba(0, 210, 255, 0.15)" stroke-width="1" />

  <text x="85" y="125" class="orbitron" font-size="13" fill="#00d2ff" font-weight="bold">DEFENSE MATRIX METRICS</text>
  <line x1="85" y1="135" x2="355" y2="135" stroke="rgba(0, 210, 255, 0.15)" stroke-width="1" />

  <!-- Metric Box 1: Total Scanned -->
  <rect x="85" y="150" width="270" height="75" rx="6" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(0, 210, 255, 0.12)" stroke-width="1" />
  <text x="100" y="173" class="mono text-muted" font-size="11">TOTAL PROMPTS SCANNED</text>
  <text x="100" y="205" class="orbitron" font-size="22" fill="#ffffff" font-weight="bold">148,920 <tspan font-size="12" fill="#4ade80">+14%</tspan></text>

  <!-- Metric Box 2: Threats Blocked -->
  <rect x="85" y="240" width="270" height="75" rx="6" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(239, 68, 68, 0.2)" stroke-width="1" />
  <text x="100" y="263" class="mono text-muted" font-size="11">INJECTIONS BLOCKED</text>
  <text x="100" y="295" class="orbitron" font-size="22" fill="#f87171" font-weight="bold">1,842 <tspan font-size="12" fill="#f87171">(99.7%)</tspan></text>

  <!-- Metric Box 3: Latency -->
  <rect x="85" y="330" width="270" height="75" rx="6" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(0, 210, 255, 0.12)" stroke-width="1" />
  <text x="100" y="353" class="mono text-muted" font-size="11">AVERAGE GATEWAY LATENCY</text>
  <text x="100" y="385" class="orbitron" font-size="22" fill="#00d2ff" font-weight="bold">11.4 ms <tspan font-size="12" fill="#38bdf8">FAST</tspan></text>

  <!-- Active Engines List -->
  <text x="85" y="440" class="orbitron" font-size="12" fill="#c084fc" font-weight="bold">ACTIVE PROTECTION LAYERS</text>
  
  <rect x="85" y="455" width="270" height="42" rx="4" fill="rgba(192, 132, 252, 0.08)" stroke="rgba(192, 132, 252, 0.25)" stroke-width="1" />
  <circle cx="103" cy="476" r="4" fill="#c084fc" />
  <text x="117" y="480" font-size="12" fill="#ffffff" font-weight="600">L1: XGBoost ML Classifier</text>
  <text x="315" y="480" class="mono text-green" font-size="10" text-anchor="end">ONLINE</text>

  <rect x="85" y="507" width="270" height="42" rx="4" fill="rgba(0, 210, 255, 0.08)" stroke="rgba(0, 210, 255, 0.25)" stroke-width="1" />
