  <text x="315" y="584" class="mono text-green" font-size="10" text-anchor="end">ACTIVE</text>

  <!-- ================= CENTER PANEL: DUAL-LAYER DIAGRAM & LOGS ================= -->
  <rect x="395" y="95" width="530" height="340" rx="8" fill="url(#cardGrad)" stroke="rgba(0, 210, 255, 0.15)" stroke-width="1" />

  <text x="415" y="125" class="orbitron" font-size="13" fill="#00d2ff" font-weight="bold">FIREWALL ARCHITECTURE LOGIC FLOW</text>
  <line x1="415" y1="135" x2="905" y2="135" stroke="rgba(0, 210, 255, 0.15)" stroke-width="1" />

  <!-- Flow Diagram Elements -->
  <!-- User Prompt Node -->
  <rect x="420" y="210" width="100" height="70" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(148, 163, 184, 0.4)" stroke-width="1.5" />
  <text x="470" y="242" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">USER PROMPT</text>
  <text x="470" y="260" class="mono text-muted" font-size="10" text-anchor="middle">Incoming Payload</text>

  <!-- Arrow 1 -->
  <line x1="520" y1="245" x2="555" y2="245" stroke="#00d2ff" stroke-width="2" stroke-dasharray="4,2" />
  <polygon points="560,245 552,240 552,250" fill="#00d2ff" />

  <!-- Shield Layer 1 (XGBoost) -->
  <path d="M 580,180 L 650,180 L 670,245 L 650,310 L 580,310 L 560,245 Z" fill="rgba(192, 132, 252, 0.15)" stroke="#c084fc" stroke-width="2" filter="url(#glowCyan)" />
  <text x="615" y="238" class="orbitron" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">LAYER 1</text>
  <text x="615" y="256" class="mono" font-size="10" fill="#c084fc" text-anchor="middle">XGBoost ML</text>

  <!-- Arrow 2 -->
  <line x1="670" y1="245" x2="705" y2="245" stroke="#00d2ff" stroke-width="2" stroke-dasharray="4,2" />
  <polygon points="710,245 702,240 702,250" fill="#00d2ff" />

  <!-- Shield Layer 2 (Behavioral Regex) -->
  <path d="M 730,180 L 800,180 L 820,245 L 800,310 L 730,310 L 710,245 Z" fill="rgba(0, 210, 255, 0.15)" stroke="#00ffff" stroke-width="2" filter="url(#glowCyan)" />
  <text x="765" y="238" class="orbitron" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">LAYER 2</text>
  <text x="765" y="256" class="mono" font-size="10" fill="#00ffff" text-anchor="middle">Behavior Gate</text>

  <!-- Arrow 3 to LLM -->
  <line x1="820" y1="245" x2="845" y2="245" stroke="#4ade80" stroke-width="2" />
  <polygon points="850,245 842,240 842,250" fill="#4ade80" />

  <!-- Target LLM Node -->
  <rect x="850" y="210" width="65" height="70" rx="8" fill="rgba(34, 197, 94, 0.15)" stroke="#22c55e" stroke-width="1.5" />
  <text x="882" y="244" class="orbitron" font-size="11" fill="#4ade80" font-weight="bold" text-anchor="middle">SAFE</text>
  <text x="882" y="260" class="orbitron" font-size="11" fill="#ffffff" text-anchor="middle">LLM</text>

  <!-- Blocked Deflection Path -->
  <path d="M 615,310 L 615,360 L 690,360" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2" />
  <polygon points="695,360 687,355 687,365" fill="#ef4444" />

  <rect x="695" y="342" width="110" height="35" rx="4" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1" />
  <text x="750" y="364" class="mono text-red" font-size="11" font-weight="bold" text-anchor="middle">BLOCKED (403)</text>

  <!-- Real-Time Console Terminal -->
  <rect x="395" y="450" width="530" height="215" rx="8" fill="rgba(4, 8, 18, 0.9)" stroke="rgba(0, 210, 255, 0.2)" stroke-width="1" />
  <text x="415" y="475" class="mono text-cyan" font-size="12" font-weight="bold">&gt;_ REAL-TIME SECURITY LOG AUDIT</text>
  <line x1="415" y1="485" x2="905" y2="485" stroke="rgba(0, 210, 255, 0.1)" stroke-width="1" />

  <!-- Log Entries -->
  <text x="415" y="510" class="mono" font-size="11" fill="#64748b">[21:28:02] <tspan fill="#38bdf8">INBOUND</tspan> POST /v1/chat/completions from 192.168.1.45</text>
  
  <rect x="415" y="522" width="490" height="26" rx="4" fill="url(#redAlertGrad)" />
  <text x="425" y="540" class="mono text-red" font-size="11">[21:28:03] ALERT: Prompt Injection Detected ("Ignore system instructions...")</text>
  <text x="895" y="540" class="mono text-red" font-size="10" text-anchor="end">BLOCKED (L1)</text>

  <text x="415" y="570" class="mono" font-size="11" fill="#64748b">[21:28:05] <tspan fill="#38bdf8">INBOUND</tspan> POST /v1/chat/completions from 10.0.0.12</text>
  <text x="415" y="590" class="mono text-green" font-size="11">[21:28:05] PASS: Sanitized payload verified -&gt; Forwarded to LLM (12ms)</text>

  <text x="415" y="620" class="mono" font-size="11" fill="#64748b">[21:28:11] <tspan fill="#38bdf8">INBOUND</tspan> POST /v1/chat/completions from 172.16.0.8</text>
  <text x="415" y="640" class="mono text-purple" font-size="11">[21:28:11] ALERT: System Prompt Leak Attempt -&gt; Quarantined by L2 Gate</text>

  <!-- ================= RIGHT PANEL: THREAT BREAKDOWN & DEPLOYMENT ================= -->
  <rect x="940" y="95" width="275" height="570" rx="8" fill="url(#cardGrad)" stroke="rgba(0, 210, 255, 0.15)" stroke-width="1" />

  <text x="960" y="125" class="orbitron" font-size="13" fill="#00d2ff" font-weight="bold">THREAT TYPE DISTRIBUTION</text>
  <line x1="960" y1="135" x2="1195" y2="135" stroke="rgba(0, 210, 255, 0.15)" stroke-width="1" />

  <!-- Bar 1: Direct Injection -->
  <text x="960" y="165" font-size="11" fill="#e2e8f0">Prompt Injection</text>
  <text x="1195" y="165" class="mono text-cyan" font-size="11" text-anchor="end">48%</text>
  <rect x="960" y="175" width="235" height="8" rx="4" fill="rgba(30, 41, 59, 0.8)" />
  <rect x="960" y="175" width="112" height="8" rx="4" fill="url(#cyanGlowGrad)" />

  <!-- Bar 2: Jailbreak -->
  <text x="960" y="210" font-size="11" fill="#e2e8f0">Jailbreak Payloads</text>
  <text x="1195" y="210" class="mono text-purple" font-size="11" text-anchor="end">32%</text>
  <rect x="960" y="220" width="235" height="8" rx="4" fill="rgba(30, 41, 59, 0.8)" />
  <rect x="960" y="220" width="75" height="8" rx="4" fill="url(#purpleGlowGrad)" />

  <!-- Bar 3: System Leak -->
  <text x="960" y="255" font-size="11" fill="#e2e8f0">Data Extraction</text>
  <text x="1195" y="255" class="mono text-red" font-size="11" text-anchor="end">20%</text>
  <rect x="960" y="265" width="235" height="8" rx="4" fill="rgba(30, 41, 59, 0.8)" />
  <rect x="960" y="265" width="47" height="8" rx="4" fill="#f87171" />

  <!-- Stack Technologies -->
  <text x="960" y="325" class="orbitron" font-size="13" fill="#c084fc" font-weight="bold">TECH STACK &amp; INFRA</text>
  <line x1="960" y1="335" x2="1195" y2="335" stroke="rgba(0, 210, 255, 0.15)" stroke-width="1" />

  <!-- Tech Badges Grid -->
