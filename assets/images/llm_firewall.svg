  <text x="1015" y="372" class="orbitron" font-size="11" fill="#60a5fa" text-anchor="middle">Python 3.11</text>

  <rect x="1085" y="350" width="110" height="35" rx="6" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" />
  <text x="1140" y="372" class="orbitron" font-size="11" fill="#34d399" text-anchor="middle">FastAPI</text>

  <rect x="960" y="395" width="110" height="35" rx="6" fill="rgba(192, 132, 252, 0.12)" stroke="rgba(192, 132, 252, 0.3)" />
  <text x="1015" y="417" class="orbitron" font-size="11" fill="#c084fc" text-anchor="middle">XGBoost</text>

  <rect x="1085" y="395" width="110" height="35" rx="6" fill="rgba(14, 165, 233, 0.12)" stroke="rgba(14, 165, 233, 0.3)" />
  <text x="1140" y="417" class="orbitron" font-size="11" fill="#38bdf8" text-anchor="middle">Docker</text>

  <rect x="960" y="440" width="235" height="35" rx="6" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.3)" />
  <text x="1077" y="462" class="orbitron" font-size="11" fill="#fbbf24" text-anchor="middle">PostgreSQL Analytics</text>

  <!-- Security Certification Badge -->
  <rect x="960" y="500" width="235" height="145" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(0, 210, 255, 0.3)" stroke-width="1" />
  <circle cx="1077" cy="545" r="22" fill="rgba(0, 210, 255, 0.15)" stroke="#00d2ff" stroke-width="1.5" />
  <path d="M 1077,533 L 1088,540 L 1088,552 C 1088,557 1083,561 1077,563 C 1071,561 1066,557 1066,552 L 1066,540 Z" fill="none" stroke="#00ffff" stroke-width="2" />
  <text x="1077" y="585" class="orbitron" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">AI SECURITY SHIELD</text>
  <text x="1077" y="605" font-size="10" fill="#94a3b8" text-anchor="middle">Enterprise LLM Protection</text>
  <text x="1077" y="622" class="mono text-green" font-size="10" text-anchor="middle">STATUS: SECURED &amp; RUNNING</text>

</svg>